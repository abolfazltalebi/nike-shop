<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>
    <link
      rel="shortcut icon"
      href="../../../public/assets/images/favicon.ico"
      type="image/x-icon"
    />
    <link rel="stylesheet" href="../../../public/font/font.css" />
    <link rel="stylesheet" href="./login.css" />
    <link rel="stylesheet" href="../../../src/output.css" />
  </head>
  <body class="m-0 p-0">
    <!-- login section -->
    <section class="grid grid-cols-1 md:grid-cols-2 gap-2">
      <!-- one item login left -->
      <div
        class="bg-[url(/public/assets/images/back-hero-section.webp)] bg-contain bg-center bg-no-repeat md:h-screen flex justify-center bg-blue-300"
      >
        <img
          src="../../../public/assets/images/Sport Shoes.webp"
          class="scale-up-bl"
          alt=""
        />
      </div>
      <!-- two item login right -->
      <div class="flex items-center justify-center">
        <div class="md:w-1/2 space-y-5 p-10 md:p-0">
          <h2 class="capitalize text-2xl font-bold">
            Welcome to the nike shop.
          </h2>
          <p class="text-sm text-gray-500">
            To log in or register, please enter your national code.
          </p>
          <form action="" class="space-y-3">
            <label for="National">National code :</label>
            <input
              type="text"
              id="National"
              class="bg-blue-100 w-full p-3 text-black rounded-md"
              placeholder="example:01234556"
            />
            <input
              type="submit"
              value="Continue"
              class="w-full bg-blue-600 p-3 rounded-md text-white"
            />
            <p class="text-sm text-gray-500">
              Your information is confidential and will only be used for
              authentication.
            </p>
          </form>
        </div>
      </div>
    </section>
  </body>
</html>
